interface:
  display_name: "GitHub PR Review Handler"
  short_description: "GitHub PRレビュー指摘の妥当性確認、修正、コミット、返信を支援"
  default_prompt: "Use $github-pr-review-handler to handle unresolved PR comments, independently review any resulting changes until clear, then push and reply with the repository's mcp__github__* tools."
dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server that exposes mcp__github__* tools"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
policy:
  allow_implicit_invocation: true
