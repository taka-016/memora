name: memora

services:
  dev:
    build:
      context: docker
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-Asia/Tokyo}
    init: true
    working_dir: /workspaces/memora
    env_file: docker/.env
    volumes:
      - .:/workspaces/memora:cached
      - ${HOME}/.gitconfig:/root/.gitconfig:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - github-config:/root/.config/gh
      - claude-global:/root/.claude
      - codex-global:/root/.codex
      - android-config:/root/.android
      - gradle:/root/.gradle
      - bashhistory:/commandhistory
      - ssh-host-keys:/etc/ssh
      - tmux-config:/root/.config/tmux
    ports:
      - '2222:22'
    healthcheck:
      test: ['CMD-SHELL', 'test -s /run/sshd.pid && kill -0 "$$(cat /run/sshd.pid)"']
      interval: 5s
      timeout: 3s
      retries: 12

  emulator:
    profiles: [test]
    build:
      context: docker/emulator
    network_mode: none
    devices:
      - /dev/kvm:/dev/kvm
    cpus: 2
    mem_limit: 4g
    stop_grace_period: 30s
    volumes:
      - android-config:/root/.android
      - emulator-data:/var/lib/memora-emulator
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1']
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 36

volumes:
  github-config:
    name: github-config-memora
  claude-global:
    name: claude-global-memora
  codex-global:
    name: codex-global-memora
  android-config:
    name: android-config-memora
  gradle:
    name: gradle-memora
  bashhistory:
    name: bashhistory-memora
  ssh-host-keys:
    name: ssh-host-keys-memora
  tmux-config:
    name: tmux-config-memora
  emulator-data:
    name: emulator-data-memora
